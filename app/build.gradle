plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.tuvio.tools.dlnaclient'
    compileSdk 34

    defaultConfig {
        applicationId 'io.frtsvnth.disktv'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.5.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += 'distribution'
    productFlavors {
        current {
            dimension 'distribution'
        }
        legacy {
            dimension 'distribution'
            applicationId 'ru.tuvio.tools.dlnaclient'
            resValue 'string', 'launcher_name', 'Диск ТВ (старая версия)'
        }
    }

    signingConfigs {
        if (System.getenv('DISKTV_KEYSTORE')) {
            publicRelease {
                storeFile file(System.getenv('DISKTV_KEYSTORE'))
                storePassword System.getenv('DISKTV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DISKTV_KEY_ALIAS')
                keyPassword System.getenv('DISKTV_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('DISKTV_KEYSTORE')) signingConfig signingConfigs.publicRelease
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Keep transitive Kotlin stdlib modules aligned across AndroidX and Media3.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
}
