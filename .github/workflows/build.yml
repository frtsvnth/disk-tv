name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test, lint and build
        run: ./gradlew testCurrentDebugUnitTest testLegacyDebugUnitTest lintCurrentDebug lintLegacyDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: disk-tv-debug-and-reports
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/reports/tests/test*DebugUnitTest/
            app/build/reports/lint-results-*Debug.*
